services:

  # ==========================================================
  # PostgreSQL DATABASE
  # ==========================================================

  db:
    image: postgres:16-alpine

    container_name: online-banking-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: online_banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U banking_user -d online_banking"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: online-banking-api

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:

      DATABASE_URL: postgresql+psycopg://banking_user:banking_password@db:5432/online_banking

      SECRET_KEY: change-this-to-a-long-random-secret-key

      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      ADMIN_EMAIL: admin@example.com

      ADMIN_PASSWORD: change-this-admin-password

      SMTP_HOST: ""

      SMTP_PORT: 587

      SMTP_USERNAME: ""

      SMTP_PASSWORD: ""

      SMTP_FROM: ""

    ports:
      - "8000:8000"

    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


# ============================================================
# PERSISTENT DATABASE STORAGE
# ============================================================

volumes:

  postgres_data:
